<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('lifetag_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice &mdash; Lifetag</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="invoice-page">

<div class="invoice-actions">
  <a class="btn-secondary" id="backLink" href="#">&larr; Back</a>
  <button class="btn-primary" id="printBtn" style="width:auto; padding:10px 18px;">Print / Save as PDF</button>
  <button class="btn-secondary" id="payBtn" style="display:none;">Record payment</button>
</div>

<div class="invoice-actions" id="payBox" style="display:none;">
  <input type="number" id="payAmount" min="1" step="0.01" placeholder="Amount (&#8377;)" style="padding:9px 12px; border:1px solid var(--border-1); border-radius:8px; width:150px;">
  <select id="payMethod" style="padding:9px 12px; border:1px solid var(--border-1); border-radius:8px;">
    <option>Cash</option><option>UPI</option><option>Card</option><option>Net Banking</option><option>Cheque</option>
  </select>
  <input type="text" id="payRef" placeholder="Reference (optional)" style="padding:9px 12px; border:1px solid var(--border-1); border-radius:8px;">
  <button class="btn-primary" id="paySave" style="width:auto; padding:9px 16px;">Save payment</button>
  <span id="payMsg" style="font-size:12.5px; color:var(--coral-500);"></span>
</div>

<div class="invoice" id="invoice">
  <p id="loading" style="text-align:center; color:#5C7079;">Loading invoice&hellip;</p>
</div>

<script src="../js/theme.js"></script>
<script src="../js/api-config.js"></script>
<script src="../js/invoice.js"></script>
</body>
</html>
