# ==============================
# LifeTag HMS - Backend Config
# ==============================
server.port=8080
spring.application.name=lifetag-hms-backend

# ---- Active profile ----
# MySQL is the only supported database. Override only if your hosting setup requires it.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Seed data (data.sql) runs after Hibernate creates the schema ----
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---- Data seeding ----
# Demo logins + sample data use published passwords. Keep disabled except on a disposable demo database.
app.seed.demo-data=${SEED_DEMO_DATA:false}
# First-admin bootstrap for real deployments: set all three on the first start against an
# EMPTY database, sign in, then remove BOOTSTRAP_ADMIN_PASSWORD from the environment.
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:Administrator}

# ---- Behind nginx: trust X-Forwarded-For so per-client login throttling sees real addresses ----
server.forward-headers-strategy=native

# ---- Don't leak internals in error responses ----
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---- JWT ----
# Required: set JWT_SECRET in your environment (see deploy/.env.example).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
# Token lifetime when "Remember this device" is ticked on the login form (30 days).
app.jwt.remember-expiration-ms=2592000000

# ---- CORS (frontend origin(s), comma separated) ----
# In docker-compose, the frontend nginx container proxies /api same-origin, so this only
# matters if you open the frontend directly against the backend (dev mode). Override with
# the ALLOWED_ORIGINS env var in production.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8081,http://localhost,null}

# ---- Large demo dataset (only applies when app.seed.demo-data=true) ----
# Local demo dataset only. Keep disabled by default; enable only for a disposable demo database.
# Adds ~20 doctors, ~300 patients with years of clinical history (vitals/BP, MRI/CT/lab reports,
# treatments, admissions), itemised invoices, blood bank, insurance, schemes and feedback.
app.seed.large-dataset=${SEED_LARGE_DATASET:false}

# ---- Hospital details printed on invoices ----
app.hospital.name=LifeTag Multispeciality Hospital
app.hospital.address=12 Health Avenue, Sangli, Maharashtra 416416
app.hospital.phone=+91 233 000 0000
app.hospital.email=billing@lifetag.com
