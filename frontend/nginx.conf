server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;
    client_max_body_size 2m;

    # Multi-page static site: serve files/directories as-is, 404 page falls
    # back to the login page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend so the frontend can call /api/* same-origin
    # (no CORS needed in production — see backend/src/main/resources/application.properties).
    location /api/ {
        proxy_pass http://cooperative-luck.railway.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }


    gzip on;
    gzip_types text/css application/javascript application/json;
}
