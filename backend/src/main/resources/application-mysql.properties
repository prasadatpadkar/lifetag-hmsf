# To use MySQL in production:
#   1. Create database:  CREATE DATABASE lifetag_hms;
#   2. Run app with:      java -jar hms-backend.jar --spring.profiles.active=mysql
#   3. Set DB_PASSWORD (required - there is deliberately no default) and, if needed,
#      DB_HOST / DB_PORT / DB_NAME / DB_USERNAME as environment variables.
#      e.g.  DB_PASSWORD='your-password' java -jar hms-backend.jar --spring.profiles.active=mysql

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lifetag_hms}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:lifetag_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Production must never run with the published development signing key.
app.jwt.secret=${JWT_SECRET}
app.seed.demo-data=${SEED_DEMO_DATA:false}
app.seed.large-dataset=${SEED_LARGE_DATASET:false}
